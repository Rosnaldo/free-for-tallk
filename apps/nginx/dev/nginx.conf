
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    server {
        listen 80;
        server_name fale-com-a-missao.com www.fale-com-a-missao.com;
        return 301 https://$host$request_uri;  # redireciona todo HTTP para HTTPS
    }

    server {
        listen 443 ssl;
        server_name fale-com-a-missao.com www.fale-com-a-missao.com;

        ssl_certificate /etc/nginx/certs/fale-com-a-missao.com.pem;
        ssl_certificate_key /etc/nginx/certs/fale-com-a-missao.com-key.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NGINX compresses responses before sending them to the client (browser)
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;

        location / {
            proxy_pass http://web:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Redirect /myadmin → /myadmin/
        location = /myadmin {
            return 301 /myadmin/;
        }

        # Admin SPA (Vite dev server — proxied, not served from dist/, so HMR works).
        # No path after the upstream: nginx forwards the URI unchanged, keeping the
        # /myadmin/ prefix intact — Vite itself is configured with base: /myadmin/.
        location /myadmin/ {
            proxy_pass http://admin:5174;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/ {
            client_max_body_size 10m;
            proxy_pass http://api:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # /ws/volunteer and /ws/customer are long-lived websockets under
            # this same prefix -- nginx's 60s default read/send timeout has
            # almost no margin over the app's 30s ping interval, and closes
            # the connection as merely "idle" even though it's healthy.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /realtime/ {
            proxy_pass http://realtime:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Same reasoning as /api/ above -- this is the long-lived
            # websocket InitWs holds open, pinged every 30s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
