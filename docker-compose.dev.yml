services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
        restart: true
      realtime:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true
      web:
        condition: service_started
        restart: true
      admin:
        condition: service_started
        restart: true
    volumes:
      # Main nginx config
      - ./apps/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/nginx/dev/certs:/etc/nginx/certs:ro
    networks:
      - free_for_talk

  api:
    image: api
    container_name: api
    pull_policy: build
    build:
      context: .
      dockerfile: apps/api/dockerfile.dev
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env
      - ./apps/api/.env.dev
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://admin:secret@mongo:27017/free_for_talk?authSource=admin&authMechanism=SCRAM-SHA-256
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: poc
      KEYCLOAK_ISSUER_URL: https://fale-com-a-missao.com/auth/realms/poc
      REALTIME_INTERNAL_URL: http://realtime:5003
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:4000/readiness', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - free_for_talk

  realtime:
    image: realtime
    container_name: realtime
    pull_policy: build
    build:
      context: .
      dockerfile: apps/realtime/dockerfile.dev
    ports:
      - "5003:5003"
    env_file:
      - ./apps/realtime/.env
      - ./apps/realtime/.env.dev
    environment:
      PORT: 5003
      REDIS_URI: redis://redis:6379
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5003/readiness', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - free_for_talk

  web:
    image: web
    container_name: web
    pull_policy: build
    build:
      context: .
      dockerfile: apps/web/dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - ./apps/web/.env
      - ./apps/web/.env.development
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      - free_for_talk

  admin:
    image: admin
    container_name: admin
    pull_policy: build
    build:
      context: .
      dockerfile: apps/admin/dockerfile.dev
    ports:
      - "5174:5174"
    env_file:
      - ./apps/admin/.env
      - ./apps/admin/.env.development
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      - free_for_talk

  postgres:
    image: postgres:18rc1
    pull_policy: always
    restart: no
    ports:
      - 5432:5432
    shm_size: 128m
    env_file :
      - ./apps/keycloak/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - free_for_talk

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4
    pull_policy: always
    restart: no
    ports:
      - 8080:8080
    env_file :
      - ./apps/keycloak/.env
      - ./apps/keycloak/.env.dev
    volumes:
      # Themes customizados
      - ./apps/keycloak/my-themes:/opt/keycloak/themes
      - ./apps/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: [
      "start-dev", 
      "--spi-theme-cache-themes=false",
      "--spi-theme-cache-templates=false",
      "--spi-theme-static-max-age=-1",
      "--http-port=8080", 
      "--hostname-debug=true",
      "--health-enabled=true",
      "--verbose",
      "--db=postgres",
      "--db-url=jdbc:postgresql://postgres:5432/$${DB_POSTGRES_SPACE}",
      "--db-password=$${DB_POSTGRES_PASSWORD}",
      "--db-username=$${DB_POSTGRES_USER}",
      "--import-realm",
    ]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - free_for_talk

  mongo:
    container_name: mongo
    image: mongo:8.0.14-noble
    pull_policy: always
    restart: no
    ports:
      - 27017:27017
    env_file:
      - ./apps/api/.env.dev
    volumes:
      - free_for_talk_mongo:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --authenticationDatabase admin --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} localhost:27017/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - free_for_talk

  redis:
    image: redis:7-alpine
    container_name: free_for_talk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - free_for_talk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - free_for_talk

volumes:
  free_for_talk_keycloak_postgres:
    name: free_for_talk_dev_keycloak_postgres
  free_for_talk_mongo:
    name: free_for_talk_dev_mongo
  free_for_talk_redis:
    name: free_for_talk_dev_redis

networks:
  free_for_talk:
    name: free_for_talk_dev
